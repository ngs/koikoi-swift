# Periphery (unused code) configuration.
#   periphery scan -- -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
# Symbols used only from the visionOS target (SpatialBoardView, e.g.
# KoikoiDebugLaunch and the board panels it hosts as RealityView attachments:
# BoardYakuPanel, ScoreboardStrip, SpatialPanelOffsets and the public
# CapturedDetail initializer), the iOS-only branches
# (WideLayoutMetrics.phone, isLandscapePhone) and the test-only hooks on
# GameViewModel are reported as unused when scanning the macOS destination;
# treat those as known false positives. SpatialBoardView is entirely inside
# `#if os(visionOS)`, so its imports (and anything only it reaches, such as
# OpponentPersona) can be reported as unused for the same reason.
project: Koikoi.xcworkspace
schemes:
  - Koikoi
retain_swift_ui_previews: true
retain_codable_properties: true
relative_results: true
