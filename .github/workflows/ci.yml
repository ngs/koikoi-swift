name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (SPM)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
      - name: Coverage summary
        run: |
          BIN=$(swift build --show-bin-path)
          PROF="$BIN/codecov/default.profdata"
          XCTEST=$(find "$BIN" -name '*.xctest' | head -1)
          if [ -n "$XCTEST" ] && [ -f "$PROF" ]; then
            echo '## Coverage Report' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun llvm-cov report "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
              -instr-profile "$PROF" -ignore-filename-regex 'Tests|.build' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  build:
    name: Build app (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install Tuist
        run: brew install tuist
      - name: Generate project
        run: tuist generate --no-open
      - name: Build
        run: |
          xcodebuild -workspace Koikoi.xcworkspace -scheme Koikoi \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
